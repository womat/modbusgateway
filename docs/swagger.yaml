definitions:
  app.ActivityResponse:
    properties:
      buses:
        items:
          $ref: '#/definitions/app.BusActivity'
        type: array
      clients:
        description: the most recent first
        items:
          $ref: '#/definitions/app.ClientActivity'
        type: array
      listeners:
        items:
          $ref: '#/definitions/app.ListenerActivity'
        type: array
      recent:
        description: the last 100, newest first
        items:
          $ref: '#/definitions/app.TransactionActivity'
        type: array
    type: object
  app.BusActivity:
    properties:
      address:
        description: host:port, or the serial port with its line settings
        type: string
      connected:
        type: boolean
      errors:
        type: integer
      lastConnectAt:
        type: string
      meanDuration:
        description: seconds per transaction
        type: number
      name:
        type: string
      queueLen:
        type: integer
      queueSize:
        type: integer
      timeouts:
        type: integer
      transactions:
        description: since the start
        type: integer
      type:
        description: tcp | rtu
        type: string
    type: object
  app.ClientActivity:
    properties:
      address:
        type: string
      connected:
        description: 'tcp: a connection is open'
        type: boolean
      connectedSince:
        description: 'tcp: the oldest open connection'
        type: string
      errors:
        description: timeouts, exceptions and refused requests
        type: integer
      firstAt:
        type: string
      lastAt:
        type: string
      perMinute:
        description: requests in the last 60 s
        type: integer
      requests:
        type: integer
      source:
        description: rest | tcp | rtu
        type: string
      targets:
        items:
          $ref: '#/definitions/app.TargetActivity'
        type: array
    type: object
  app.ListenerActivity:
    properties:
      address:
        description: host:port, or the serial port
        type: string
      openConnections:
        description: 'tcp: open connections, silent ones included'
        type: integer
      settings:
        description: 'rtu: line settings, e.g. 9600 8N1'
        type: string
      source:
        description: rest | tcp | rtu
        type: string
    type: object
  app.ModbusErrorResponse:
    properties:
      error:
        type: string
    type: object
  app.ModbusWriteCoilsRequest:
    properties:
      value:
        example: true
        type: boolean
      values:
        items:
          type: boolean
        type: array
    type: object
  app.ModbusWriteRegistersRequest:
    properties:
      value:
        example: 7
        type: integer
      values:
        items:
          type: integer
        type: array
    type: object
  app.TargetActivity:
    properties:
      device:
        type: string
      unitId:
        type: integer
    type: object
  app.TransactionActivity:
    properties:
      address:
        type: integer
      class:
        description: ok | cache | exception | timeout | error | rejected
        type: string
      client:
        description: IP address; empty for the serial line
        type: string
      device:
        type: string
      duration:
        type: number
      functionCode:
        type: integer
      quantity:
        type: integer
      result:
        description: ok, cache, timeout, forbidden, the exception of the device, ...
        type: string
      source:
        description: rest | tcp | rtu
        type: string
      time:
        type: string
      unitId:
        description: the unit ID used on a Modbus listener
        type: integer
    type: object
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
  modbusclient.DeviceStatusResponse:
    properties:
      bus:
        type: string
      cacheHits:
        type: integer
      cacheMisses:
        type: integer
      cacheTTL:
        description: seconds a read stays in the cache; 0 = no cache
        type: number
      connected:
        description: the bus connection is open
        type: boolean
      description:
        type: string
      device:
        type: string
      functions:
        description: allowed function codes, e.g. ["FC3","FC4"]
        items:
          type: string
        type: array
      gateway:
        allOf:
        - $ref: '#/definitions/modbusclient.Gateway'
        description: the Modbus listener that offers the device
      lastConnectAt:
        type: string
      lastError:
        type: string
      lastErrorAt:
        description: lastError stays until the next error
        type: string
      lastRequestAt:
        type: string
      lastSuccessAt:
        type: string
      queueLen:
        description: requests waiting on the bus
        type: integer
      transport:
        type: string
      unitId:
        type: integer
    type: object
  modbusclient.Gateway:
    properties:
      listener:
        description: tcp | rtu
        type: string
      unitId:
        description: the unit ID on that listener
        type: integer
    type: object
  modbusclient.ReadBitsResponse:
    properties:
      address:
        type: integer
      addressHex:
        type: string
      cached:
        description: answered from the cache, without a bus transaction
        type: boolean
      dataHex:
        description: packed, eight values per byte, first value in the lowest bit
        type: string
      device:
        type: string
      duration:
        type: number
      functionCode:
        type: integer
      quantity:
        type: integer
      transport:
        type: string
      unitId:
        type: integer
      values:
        description: one value per address
        items:
          type: boolean
        type: array
    type: object
  modbusclient.ReadRegistersResponse:
    properties:
      address:
        type: integer
      addressHex:
        type: string
      cached:
        description: answered from the cache, without a bus transaction
        type: boolean
      dataHex:
        description: two bytes per register, big endian
        type: string
      device:
        type: string
      duration:
        type: number
      functionCode:
        type: integer
      quantity:
        type: integer
      transport:
        type: string
      unitId:
        type: integer
      values:
        description: one unsigned value per register
        items:
          type: integer
        type: array
    type: object
  modbusclient.WriteResponse:
    properties:
      address:
        type: integer
      addressHex:
        type: string
      dataHex:
        type: string
      device:
        type: string
      duration:
        type: number
      functionCode:
        type: integer
      quantity:
        type: integer
      transport:
        type: string
      unitId:
        type: integer
    type: object
info:
  contact: {}
paths:
  /activity:
    get:
      description: Returns the listeners, the clients of the last 10 min (REST callers
        of /devices/…, Modbus TCP connections, the Modbus RTU line), the buses and
        the last 100 transactions. No register values.
      produces:
      - application/json
      responses:
        "200":
          description: Activity
          schema:
            $ref: '#/definitions/app.ActivityResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get the communication activity
      tags:
      - info
  /devices:
    get:
      description: Returns the current connection and health status for all configured
        Modbus devices.
      produces:
      - application/json
      responses:
        "200":
          description: Device status list
          schema:
            items:
              $ref: '#/definitions/modbusclient.DeviceStatusResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "503":
          description: Modbus service unavailable
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List configured device status
      tags:
      - modbus
  /devices/{device}/coils/{address}:
    get:
      description: Reads one or more coils from a configured Modbus device.
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - default: 1
        description: Number of values to read
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Coils successfully read
          schema:
            $ref: '#/definitions/modbusclient.ReadBitsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus read failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 1: Read coils'
      tags:
      - modbus
    put:
      consumes:
      - application/json
      description: 'Writes coils starting at the address. {"value": true} writes one
        coil with FC 5, {"values": [true, false]} writes one or more coils with FC
        15 — also for a single value, for devices that only accept FC 15.'
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - description: Either value (FC 5) or values (FC 15)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.ModbusWriteCoilsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Coils successfully written
          schema:
            $ref: '#/definitions/modbusclient.WriteResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus write failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 5 / FC 15: Write coils'
      tags:
      - modbus
  /devices/{device}/discrete-inputs/{address}:
    get:
      description: Reads one or more discrete inputs from a configured Modbus device.
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - default: 1
        description: Number of values to read
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Discrete inputs successfully read
          schema:
            $ref: '#/definitions/modbusclient.ReadBitsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus read failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 2: Read discrete inputs'
      tags:
      - modbus
  /devices/{device}/holding-registers/{address}:
    get:
      description: Reads one or more holding registers from a configured Modbus device.
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - default: 1
        description: Number of values to read
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Holding registers successfully read
          schema:
            $ref: '#/definitions/modbusclient.ReadRegistersResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus read failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 3: Read holding registers'
      tags:
      - modbus
    put:
      consumes:
      - application/json
      description: 'Writes holding registers starting at the address. {"value": 7}
        writes one register with FC 6, {"values": [7, 8]} writes one or more registers
        with FC 16 — also for a single value, for devices that only accept FC 16.'
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - description: Either value (FC 6) or values (FC 16)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.ModbusWriteRegistersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Registers successfully written
          schema:
            $ref: '#/definitions/modbusclient.WriteResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus write failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 6 / FC 16: Write holding registers'
      tags:
      - modbus
  /devices/{device}/input-registers/{address}:
    get:
      description: Reads one or more input registers from a configured Modbus device.
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      - description: Start address (decimal or 0x-prefixed hex)
        in: path
        name: address
        required: true
        type: string
      - default: 1
        description: Number of values to read
        in: query
        name: quantity
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Input registers successfully read
          schema:
            $ref: '#/definitions/modbusclient.ReadRegistersResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Function code not allowed for the device
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "502":
          description: Modbus read failed
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Bus queue full
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "504":
          description: Request waited too long in the bus queue
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 'FC 4: Read input registers'
      tags:
      - modbus
  /devices/{device}/status:
    get:
      description: Returns the current connection and health status for one configured
        Modbus device.
      parameters:
      - description: Configured device name
        in: path
        name: device
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Device status
          schema:
            $ref: '#/definitions/modbusclient.DeviceStatusResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
        "503":
          description: Modbus service unavailable
          schema:
            $ref: '#/definitions/app.ModbusErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get device status
      tags:
      - modbus
  /health:
    get:
      description: Retrieves memory usage, goroutine count, version, hostname, Go
        runtime version, and OS.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
