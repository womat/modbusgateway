# =============================================================================
# modbusgateway configuration
#
# ${VAR} is replaced with the environment variable VAR (only this form, a bare
# "$" stays as it is), e.g. apiKey: ${MODBUSGATEWAY_API_KEY}.
# Unknown keys are an error, so a typo cannot silently fall back to a default.
# =============================================================================

# logLevel defines the minimum log level.
# Messages with at least this level are logged.
# Allowed values: debug | info | warn | error
logLevel: info

# logDestination defines where logs are written to.
# Supported values: stdout | stderr | /path/to/logfile
logDestination: stdout

# environment: dev | prod
# dev falls back to the embedded self-signed certificate when certFile is
# missing; prod refuses to start without certFile.
env: dev


# =============================================================================
# Webserver configuration (HTTPS REST API)
# =============================================================================
webserver:
  # Host address the HTTPS server listens on (0.0.0.0 = all interfaces)
  listenHost: 0.0.0.0

  # Port the HTTPS server listens on
  listenPort: 8443

  # Global API key for protected endpoints
  apiKey: changeme!

  # TLS private key file
  keyFile: /opt/modbusgateway/etc/key.pem

  # TLS certificate file
  certFile: /opt/modbusgateway/etc/cert.pem

  # Blocked IP addresses or networks (empty = none blocked)
  # Examples: 192.168.0.1, 192.168.0.0/16, 10.0.0.0/8
  blockedIPs: []

  # Allowed IP addresses or networks (empty = all allowed)
  # Note: ::1 is the IPv6 loopback address
  # Examples: 127.0.0.1, ::1, 192.168.0.0/16
  allowedIPs: []

# =============================================================================
# Buses: the physical connections
# =============================================================================
# Every bus has one queue: requests of all clients (REST and Modbus listeners)
# reach it one after the other, writes before waiting reads.
#
# type      - rtu | tcp
# timeout   - response timeout of one request, Go duration (e.g. 1500ms, 2s)
# queueSize - requests that may wait on the bus (default 64); a full queue
#             answers "busy" (REST 503, Modbus exception 6)
# rtu       - port, baudRate, dataBits, parity, stopBits (default 9600 8N1)
# tcp       - host, port (default 502)
buses:
  rs485:
    type: rtu
    timeout: 1500ms
    rtu:
      port: /dev/ttyUSB0
      baudRate: 9600
      dataBits: 8
      parity: N          # N | E | O
      stopBits: 1

  smartfox-lan:
    type: tcp
    timeout: 2s
    tcp:
      host: smartfox.example.lan
      port: 502

# =============================================================================
# Devices
# =============================================================================
# The key is the device name in the REST API, e.g.
#   GET /devices/fronius-smartmeter/holding-registers/40000?quantity=2
#
# description - free text
# bus         - name of an entry in buses; several devices can share a bus
# unitId      - Modbus address of the device on its bus (1-247), unique per bus
# functions   - function codes the device allows, on every interface:
#               FC1 FC2 FC3 FC4 (read), FC5 FC6 FC15 FC16 (write).
#               Default [FC1, FC2, FC3, FC4]: reading only.
# cacheTTL    - how long a read is served from the cache, Go duration.
#               Default 1s on an rtu bus, 0s (no cache) on a tcp bus.
#               A write drops the cached values it changes.
# gateway     - offer the device on the Modbus listener of the other transport:
#               a device on an rtu bus on listen.tcp, a device on a tcp bus on
#               listen.rtu. unitId is the unit ID clients use there (1-247,
#               unique per listener), independent of the unitId on the bus.
devices:
  fronius-smartmeter:
    description: Main power meter
    bus: rs485
    unitId: 1
    functions: [FC3, FC4]
    cacheTTL: 1s
    gateway: { unitId: 11 }

  heatpump:
    description: Heat pump controller
    bus: rs485
    unitId: 2
    functions: [FC1, FC2, FC3, FC4, FC5, FC6, FC15, FC16]
    gateway: { unitId: 12 }

  smartfox:
    description: PV controller
    bus: smartfox-lan
    unitId: 1
    gateway: { unitId: 31 }

# =============================================================================
# Modbus listeners of the gateway
# =============================================================================
# A listener is active when its block is present: delete or comment out a
# block to turn it off. Modbus has no authentication - bind listen.tcp to a
# trusted interface or protect it with a firewall.
listen:
  # Modbus TCP: TCP clients reach the devices on rtu buses (default 0.0.0.0:1502)
  tcp:
    host: 0.0.0.0
    port: 1502

  # Modbus RTU on a serial port of its own: a client on that bus reaches the
  # devices on tcp buses. The client's timeout must cover the round trip to
  # the TCP device.
  # rtu:
  #   port: /dev/ttyUSB1
  #   baudRate: 9600
  #   dataBits: 8
  #   parity: N
  #   stopBits: 1
  #   # Silence that ends a request (default: t3.5 of the Modbus specification,
  #   # ~4ms at 9600 baud). USB adapters and the Pi UART need 20ms-40ms.
  #   interFrameDelay: 20ms
