# Continuous integration for github.com/womat/modbusgateway.
#
# Actions are pinned to a commit SHA, with the release in a comment: a tag like
# @v7 can be moved to other code, a SHA cannot. dependabot (.github/dependabot.yml)
# proposes updates for them.
#
# setup-go takes the version from go.mod but the newest patch of it (check-latest),
# and the weekly run repeats govulncheck without a change here: an advisory against
# the Go toolchain or a dependency appears between commits, and dependabot does not
# report the toolchain.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref supersedes a run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests run natively on the runner (linux/amd64): arm test binaries could
  # not be executed there. They need no hardware: Modbus devices are emulated with
  # mbserver, the serial bus of the RTU listener test with a socat pty pair.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install socat
        run: sudo apt-get install -y --no-install-recommends socat

      - name: Test with race detector
        run: make test

  # The same checks as `make lint` locally, for each released target: gofmt, go fix,
  # go mod tidy, go vet, golangci-lint and govulncheck, with and without the Swagger UI. The analysers are
  # pinned in the Makefile only; make installs them for the runner and runs them against
  # the target, so the job sets no GOOS/GOARCH of its own (a tool built for arm would not
  # start on the runner).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PI_ARCH of the Makefile: the three targets that are actually released. arm6 is
        # the default deployment target (it runs on every Pi, and a Pi Zero needs it), so
        # it must not be the one that goes untested.
        arch: [arm6, arm7, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # govulncheck exits non-zero only when this code calls a vulnerable symbol;
      # advisories that only sit in required modules are reported but do not fail.
      - name: Lint
        run: make lint PI_ARCH=${{ matrix.arch }}

      # The Swagger UI sits behind a build tag, so the plain build never compiles it.
      - name: Build, with and without Swagger UI
        run: make build_${{ matrix.arch }} build_${{ matrix.arch }}_dev
