# Test, vet, lint and build on every push and pull request.
#
# Actions are pinned to a commit SHA, with the release it belongs to in a
# comment; dependabot (.github/dependabot.yml) proposes updates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The tests run natively on the runner (linux/amd64): arm test binaries could
  # not be executed there. They need no hardware: Modbus devices are emulated with
  # mbserver, the serial bus of the RTU listener test with a socat pty pair.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install socat
        run: sudo apt-get install -y --no-install-recommends socat

      - name: Test with race detector
        run: make test

  # The same checks as `make lint` locally, for each released target: gofmt, go vet,
  # golangci-lint and govulncheck, with and without the Swagger UI. The analysers are
  # pinned in the Makefile only; make installs them for the runner and runs them against
  # the target, so the job sets no GOOS/GOARCH of its own (a tool built for arm would not
  # start on the runner).
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PI_ARCH of the Makefile: the three targets that are actually released. arm6 is
        # the default deployment target (it runs on every Pi, and a Pi Zero needs it), so
        # it must not be the one that goes untested.
        arch: [arm6, arm7, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck exits non-zero only when this code calls a vulnerable symbol;
      # advisories that only sit in required modules are reported but do not fail.
      - name: Lint
        run: make lint PI_ARCH=${{ matrix.arch }}

      # The Swagger UI sits behind a build tag, so the plain build never compiles it.
      - name: Build, with and without Swagger UI
        run: make build_${{ matrix.arch }} build_${{ matrix.arch }}_dev
