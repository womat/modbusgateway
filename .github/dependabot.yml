# Keeps the Go dependencies and the SHA-pinned GitHub Actions current.
#
# The workflows pin every action to a commit SHA with the release in a comment;
# dependabot updates both together. govulncheck is installed with `go install`
# in the workflows, which dependabot does not see - raise that pin by hand.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # Matches the "type() description" convention the release changelog groups on.
      prefix: "chore()"
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore()"
    groups:
      actions:
        patterns:
          - "*"
