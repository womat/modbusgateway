# Keeps the Go dependencies and the SHA-pinned GitHub Actions current.
#
# The workflows pin every action to a commit SHA with the release in a comment;
# dependabot updates both together. govulncheck and golangci-lint are installed
# with `go install` by `make lint` (pinned in the Makefile), which dependabot does not
# see - raise those pins by hand.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # "chore(deps): …", the "type(scope): description" convention the release changelog
      # groups on.
      prefix: "chore(deps)"
    groups:
      # The Swagger UI is only built with -tags swagger and drags in a large graph
      # of its own; its updates never touch the released binary.
      swagger:
        patterns:
          - "github.com/swaggo/*"
          - "github.com/go-openapi/*"
      everything-else:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/swaggo/*"
          - "github.com/go-openapi/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "chore(ci): …" - an action only changes the workflows, not the binary.
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
